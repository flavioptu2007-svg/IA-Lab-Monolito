# =============================================================================
# Render Blueprint — IA-Lab API (substituto gratuito do Cloud Run)
# =============================================================================
# O Render lê este arquivo automaticamente quando o repositório é conectado
# via "Blueprint" (New + → Blueprint) — cria o Web Service sozinho.
#
# Plano gratuito: sem cartão, 750h/mês, "sleep" após 15min inativo
# (o serviço acorda sozinho quando recebe a 1ª requisição).
# =============================================================================
services:
  - type: web
    name: ia-lab-api
    runtime: docker
    repo: https://github.com/flavioptu2007-svg/IA-Lab-Monolito
    dockerfilePath: ./Dockerfile.cloudrun
    plan: free
    region: sao-paulo
    healthCheckPath: /api/health
    envVars:
      # RAG desabilitado na nuvem (Qdrant é local) — decisão do projeto
      - key: IA_LAB_RAG_ENABLED
        value: "false"
      # Chave OpenAI — substitua por uma chave VÁLIDA para o chat funcionar
      - key: IA_LAB_OPENAI_API_KEY
        sync: false
      # Desliga módulos locais que não existem na nuvem
      - key: IA_LAB_BITNET_ENABLED
        value: "false"
      - key: IA_LAB_OLLAMA_ENABLED
        value: "false"
