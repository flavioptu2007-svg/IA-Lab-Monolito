# =============================================================================
# Render Blueprint — IA-Lab API (substituto gratuito do Cloud Run)
# =============================================================================
# O Render lê este arquivo automaticamente quando o repositório é conectado
# via "Blueprint" (New + → Blueprint) — cria o Web Service sozinho.
#
# Plano gratuito: sem cartão, 750h/mês, "sleep" após 15min inativo
# (o serviço acorda sozinho quando recebe a 1ª requisição).
# =============================================================================
services:
  - type: web
    name: ia-lab-api
    runtime: docker
    repo: https://github.com/flavioptu2007-svg/IA-Lab-Monolito
    dockerfilePath: ./Dockerfile.cloudrun
    plan: free
    # Virginia (costa leste EUA) = menor latência para o Brasil
    # (Render não tem região na América do Sul; válidas: oregon, ohio, virginia, frankfurt, singapore)
    region: virginia
    healthCheckPath: /api/health
    envVars:
      # RAG desabilitado na nuvem (Qdrant é local) — decisão do projeto
      - key: IA_LAB_RAG_ENABLED
        value: "false"
      # ── CHAT ────────────────────────────────────────────────────────────
      # Provider primário do chat. Opções gratuitas SEM cartão:
      #   groq   → console.groq.com (conta Google, chave gsk_...) — RECOMENDADO
      #   gemini → aistudio.google.com (chave AIza...)
      #   openai → exige chave paga (evitar)
      - key: IA_LAB_PRIMARY_PROVIDER
        value: "groq"
      # Chave Groq (grátis, sem cartão) — preencher no dashboard do Render
      - key: IA_LAB_GROQ_API_KEY
        sync: false
      # Chave OpenAI — apenas se usar openai como provider
      - key: IA_LAB_OPENAI_API_KEY
        sync: false
      # Desliga módulos locais que não existem na nuvem
      - key: IA_LAB_BITNET_ENABLED
        value: "false"
      - key: IA_LAB_OLLAMA_ENABLED
        value: "false"
