# =============================================================================
# IA-Lab Unified — Docker Compose
# =============================================================================
#  Orquestra TODOS os serviços do ecossistema unificado:
#    Core:  API, Coraci, Redis, Qdrant
#    LLM:   BitNet (1-bit)
#    Intel: OpenVINO Dashboard (Streamlit)
#    Edu:   HistóriaIA (PostgreSQL + FastAPI)
#    Audio: VAD contínuo + Batch processing
#
#  Uso:
#    docker compose up -d                   # Apenas core (sempre ativo)
#    docker compose --profile llm up -d     # Core + BitNet
#    docker compose --profile openvino up -d # Core + OpenVINO
#    docker compose --profile historiaia up -d  # Core + HistóriaIA
#    docker compose --profile all up -d     # Tudo
# =============================================================================

services:

  # ═══════════════════════════════════════════════════════════════════════════
  #  Base — Configuração compartilhada
  # ═══════════════════════════════════════════════════════════════════════════
  base: &base
    image: ia-lab-unified:latest
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - ia-lab-network
    restart: unless-stopped
    init: true

  # ═══════════════════════════════════════════════════════════════════════════
  #  API — FastAPI (monolito unificado)
  # ═══════════════════════════════════════════════════════════════════════════
  api:
    <<: *base
    container_name: ia-lab-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - QDRANT_HOST=qdrant
      - REDIS_HOST=redis
      - IA_LAB_LOG_LEVEL=INFO
      - IA_LAB_BITNET_BASE_URL=http://bitnet:8080/v1
      - IA_LAB_OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ia-models:/app/models
      - ia-cache:/app/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ═══════════════════════════════════════════════════════════════════════════
  #  Coraci Chat — Flask (legado, mantido para compatibilidade)
  # ═══════════════════════════════════════════════════════════════════════════
  coraci:
    container_name: ia-lab-coraci
    build:
      context: ./Aplicativo_Coraci
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_DEBUG=false
    volumes:
      - coraci-data:/app/data
    networks:
      - ia-lab-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════════════════
  #  Redis — Cache + Rate Limiting + Sessões
  # ═══════════════════════════════════════════════════════════════════════════
  redis:
    container_name: ia-lab-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    networks:
      - ia-lab-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════════════
  #  Qdrant — Vector Database (RAG)
  # ═══════════════════════════════════════════════════════════════════════════
  qdrant:
    container_name: ia-lab-qdrant
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - ia-lab-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════════════════
  #  BitNet — LLM 1-bit (llama-server)
  # ═══════════════════════════════════════════════════════════════════════════
  bitnet:
    container_name: ia-lab-bitnet
    build:
      context: ./AI/BitNet
      dockerfile: Dockerfile.bitnet
    image: bitnet-server:latest
    ports:
      - "8080:8080"
    environment:
      - OMP_NUM_THREADS=4
    networks:
      - ia-lab-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    profiles:
      - llm
      - all

  # ═══════════════════════════════════════════════════════════════════════════
  #  OpenVINO Dashboard — Streamlit (Intel AI Lab)
  # ═══════════════════════════════════════════════════════════════════════════
  openvino-dashboard:
    <<: *base
    container_name: ia-lab-openvino
    ports:
      - "8501:8501"
    environment:
      - OMP_NUM_THREADS=4
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - openvino-models:/app/Intel-AI-Lab/models
      - openvino-cache:/app/.cache
    command: >
      streamlit run Intel-AI-Lab/dashboard/listen_streamlit.py
        --server.port=8501
        --server.address=0.0.0.0
        --server.headless=true
    profiles:
      - openvino
      - all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ──────────────────────────────────────────────────────────────────────────
  #  OpenVINO — Flask Dashboard (sistema + RAG + benchmarks)
  # ──────────────────────────────────────────────────────────────────────────
  openvino-flask:
    <<: *base
    container_name: ia-lab-openvino-flask
    ports:
      - "5001:5000"
    command: python3 Intel-AI-Lab/dashboard/app.py
    profiles:
      - openvino
      - all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ──────────────────────────────────────────────────────────────────────────
  #  VAD — Escuta contínua (requer microfone do host)
  # ──────────────────────────────────────────────────────────────────────────
  vad:
    <<: *base
    container_name: ia-lab-vad
    restart: "no"
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    command: >
      python3 Intel-AI-Lab/examples/11_continuous_listening.py
        --search
        --faiss-dir /app/Intel-AI-Lab/recordings/faiss_index
    stdin_open: true
    tty: true
    profiles:
      - audio
      - all

  # ──────────────────────────────────────────────────────────────────────────
  #  Batch — Processamento em lote de áudios
  # ──────────────────────────────────────────────────────────────────────────
  batch:
    <<: *base
    container_name: ia-lab-batch
    restart: "no"
    volumes:
      - openvino-models:/app/Intel-AI-Lab/models
      - openvino-recordings:/app/Intel-AI-Lab/recordings
      - openvino-cache:/app/.cache
      - ./audios:/audios
    command: >
      python3 Intel-AI-Lab/examples/10_batch_audio_search.py
        --input-dir /audios
        --search
    profiles:
      - batch
      - all

  # ──────────────────────────────────────────────────────────────────────────
  #  Docs — Servidor MkDocs (documentação)
  # ──────────────────────────────────────────────────────────────────────────
  docs:
    image: python:3.12-slim
    container_name: ia-lab-docs
    restart: "no"
    ports:
      - "8002:8000"
    working_dir: /docs
    command: >
      sh -c "pip install -q mkdocs mkdocs-material && mkdocs serve --dev-addr=0.0.0.0:8000"
    volumes:
      - ./AI/openvino:/docs
    networks:
      - ia-lab-network
    profiles:
      - dev
      - all

  # ═══════════════════════════════════════════════════════════════════════════
  #  HistóriaIA — PostgreSQL Database
  # ═══════════════════════════════════════════════════════════════════════════
  historiaia-db:
    container_name: ia-lab-historiaia-db
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: historiaia
      POSTGRES_USER: historiaia
      POSTGRES_PASSWORD: historiaia
    ports:
      - "5432:5432"
    volumes:
      - historiaia-data:/var/lib/postgresql/data
    networks:
      - ia-lab-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U historiaia"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles:
      - historiaia
      - all

  # ═══════════════════════════════════════════════════════════════════════════
  #  HistóriaIA — FastAPI App
  # ═══════════════════════════════════════════════════════════════════════════
  historiaia-app:
    container_name: ia-lab-historiaia-app
    build:
      context: ./AI/historiaia
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://historiaia:historiaia@historiaia-db:5432/historiaia
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
    depends_on:
      historiaia-db:
        condition: service_healthy
    networks:
      - ia-lab-network
    restart: unless-stopped
    profiles:
      - historiaia
      - all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ═══════════════════════════════════════════════════════════════════════════
  #  Test — Executa a suíte de testes
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    <<: *base
    container_name: ia-lab-test
    restart: "no"
    command: >
      pytest tests/ -v --tb=short
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - test

networks:
  ia-lab-network:
    name: ia-lab-network
    driver: bridge

volumes:
  # Core
  qdrant-data:
    name: ia-lab-qdrant-data
  redis-data:
    name: ia-lab-redis-data
  coraci-data:
    name: ia-lab-coraci-data
  ia-models:
    name: ia-lab-models
  ia-cache:
    name: ia-lab-cache

  # OpenVINO
  openvino-models:
    name: openvino-models
  openvino-cache:
    name: openvino-cache
  openvino-recordings:
    name: openvino-recordings

  # HistóriaIA
  historiaia-data:
    name: historiaia-postgres-data
