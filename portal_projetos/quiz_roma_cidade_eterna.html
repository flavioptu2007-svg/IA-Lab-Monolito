<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: Roma, a Cidade Eterna 🏛️</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❓</text></svg>">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
* { box-sizing: border-box; }
body { margin:0; font-family:'Segoe UI',Verdana,sans-serif; background:linear-gradient(135deg,#fff8e1,#ffe0e0); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
@keyframes slideUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
@keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
@keyframes confetti { 0%{transform:translateY(-10px) rotate(0);opacity:1} 100%{transform:translateY(120vh) rotate(720deg);opacity:0} }
@keyframes pop { 0%{transform:scale(.9);opacity:0} 100%{transform:scale(1);opacity:1} }
.card-fade { animation:fadeIn .35s ease-out both; }
.card-slide { animation:slideUp .4s ease-out both; }
.pulse { animation:pulse 1s ease-in-out infinite; }
.card { background:#fff; max-width:640px; width:100%; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.15); padding:28px; position:relative; }
h1 { color:#b71c1c; text-align:center; font-size:1.5rem; margin-top:0; }
h2 { color:#b71c1c; text-align:center; }
.progress-wrap { background:#eee; border-radius:20px; height:12px; overflow:hidden; margin-bottom:8px; }
.progress-bar { background:linear-gradient(90deg,#d32f2f,#ff7043); height:100%; transition:width .4s ease; background-size:200% 100%; animation:shimmer 2s linear infinite; }
.meta { display:flex; justify-content:space-between; font-size:.9rem; color:#555; margin-bottom:20px; }
.score { color:#2e7d32; font-weight:bold; }
.question-img { width:100%; max-height:220px; object-fit:cover; border-radius:12px; margin-bottom:16px; }
.question-text { font-size:1.2rem; font-weight:700; color:#222; margin-bottom:18px; }
.option { display:block; width:100%; text-align:left; padding:14px 16px; margin-bottom:10px; border:2px solid #ddd; border-radius:10px; background:#fafafa; font-size:1rem; cursor:pointer; transition:all .2s ease; }
.option:hover:not(:disabled) { border-color:#ef9a9a; background:#fff0f0; transform:translateX(4px); }
.option.selected { border-color:#d32f2f; background:#ffebee; font-weight:600; }
.option.correct { border-color:#2e7d32; background:#e8f5e9; font-weight:700; animation:pop .3s ease both; }
.option.wrong { border-color:#c62828; background:#ffebee; font-weight:700; animation:pop .3s ease both; }
.option:disabled { cursor:not-allowed; }
.option .mark { float:right; font-size:1.1rem; }
.letter { color:#d32f2f; font-weight:700; margin-right:8px; }
.btn { width:100%; padding:14px; border:none; border-radius:10px; background:#b71c1c; color:#fff; font-size:1.1rem; font-weight:700; cursor:pointer; margin-top:8px; transition:background .2s, transform .1s; }
.btn:hover:not(:disabled) { background:#8e0000; }
.btn:active:not(:disabled) { transform:scale(.98); }
.btn:disabled { background:#ccc; cursor:not-allowed; }
.btn-outline { background:#fff; color:#b71c1c; border:2px solid #b71c1c; margin-top:12px; }
.btn-outline:hover { background:#ffebee; }
.feedback { margin-top:16px; padding:14px; border-radius:10px; font-style:italic; background:#e3f2fd; color:#333; animation:fadeIn .3s ease both; }
.feedback.correct-fb { background:#e8f5e9; border-left:4px solid #2e7d32; }
.feedback.wrong-fb { background:#ffebee; border-left:4px solid #c62828; }
.result-screen { text-align:center; }
.trophy { font-size:3rem; margin-bottom:6px; animation:pop .5s ease both; }
.final-score { font-size:1.6rem; font-weight:800; color:#2e7d32; }
.gabarito { text-align:left; background:#fafafa; border-radius:10px; padding:16px; margin:18px 0; }
.gabarito-item { border-bottom:1px solid #eee; padding:10px 0; animation:fadeIn .3s ease both; }
.gabarito-item:last-child { border-bottom:none; }
.gabarito-q { font-weight:700; color:#222; }
.gabarito-a { color:#2e7d32; font-weight:600; }
.gabarito-e { color:#666; font-size:.9rem; }
.bncc-tag { display:inline-block; background:#fff3e0; color:#e65100; font-size:.75rem; font-weight:700; padding:2px 8px; border-radius:6px; margin-bottom:4px; }
.level-btn { display:block; width:100%; padding:16px; margin-bottom:12px; border-radius:10px; border:2px solid #ddd; background:#fafafa; font-size:1.1rem; font-weight:700; cursor:pointer; transition:all .2s; }
.level-btn:hover { border-color:#d32f2f; background:#fff0f0; transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.08); }
.level-facil { color:#2e7d32; }
.level-medio { color:#f9a825; }
.level-dificil { color:#c62828; }
.intro-text { text-align:center; color:#555; margin-bottom:20px; }
.confetti-piece { position:fixed; width:10px; height:10px; border-radius:2px; animation:confetti 3s ease-in forwards; pointer-events:none; z-index:999; }
@media (max-width:480px) {
  .card { padding:20px; }
  .question-text { font-size:1.05rem; }
}
</style>
</head>
<body>
<div class="card" id="app" role="main" aria-live="polite"></div>
<script>
const bank = {
  facil: [
    { q:"Segundo a lenda, quem criou os irmãos Rômulo e Remo?", bncc:"EF06HI11",
      img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=600&h=300&fit=crop",
      options:["Uma águia","Uma loba","Um urso","Um leão"], correct:1,
      explanation:"Uma loba encontrou e criou os bebês gêmeos Rômulo e Remo, que depois fundaram Roma!" },
    { q:"Quantas pessoas cabiam no Coliseu assistindo aos espetáculos?", bncc:"EF06HI12",
      img:"https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=600&h=300&fit=crop",
      options:["10.000 pessoas","25.000 pessoas","50.000 pessoas","100.000 pessoas"], correct:2,
      explanation:"O Coliseu era gigante e podia receber até 50.000 pessoas assistindo às lutas dos gladiadores!" },
    { q:"Quanto tempo Michelangelo levou para pintar o teto da Capela Sistina?", bncc:"EF06HI13",
      img:"https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=600&h=300&fit=crop",
      options:["2 anos","4 anos","6 anos","8 anos"], correct:1,
      explanation:"Michelangelo pintou o teto da Capela Sistina entre 1508 e 1512, ou seja, 4 anos de trabalho!" },
    { q:"Quantos gatos vivem soltos pela cidade de Roma?", bncc:"EF06HI14", img:null,
      options:["50.000 gatos","150.000 gatos","300.000 gatos","500.000 gatos"], correct:2,
      explanation:"Roma tem mais de 300.000 gatos que vivem livres pela cidade, especialmente perto das ruínas antigas!" },
    { q:"Qual é o prato típico romano feito com macarrão, ovo e queijo pecorino?", bncc:"EF06HI11", img:null,
      options:["Pizza","Carbonara","Supplì","Gelato"], correct:1,
      explanation:"A Carbonara é um prato típico de Roma feito com macarrão, ovo, queijo pecorino e pancetta!" }
  ],
  medio: [
    { q:"Por que o Coliseu tinha um 'elevador' nas partes subterrâneas?", bncc:"EF06HI12", img:null,
      options:["Para levar comida aos espectadores","Para trazer animais selvagens até a arena","Para transportar gladiadores feridos","Para guardar as espadas"], correct:1,
      explanation:"O Coliseu tinha elevadores especiais para trazer animais selvagens das jaulas subterrâneas até a arena!" },
    { q:"Por que Roma é chamada de 'Cidade Eterna'?", bncc:"EF06HI11", img:null,
      options:["Porque foi construída há 1.000 anos","Porque mistura passado e presente e sempre revela algo novo","Porque não tem mais moradores","Porque é a capital mais antiga do mundo"], correct:1,
      explanation:"Roma é chamada assim porque nunca envelhece: passado e presente se misturam e sempre há algo novo para descobrir!" },
    { q:"O que os romanos construíram para transportar água limpa pela cidade?", bncc:"EF06HI14",
      img:"https://images.unsplash.com/photo-1515542622106-78bda8ba0e5b?w=600&h=300&fit=crop",
      options:["Poços","Aquedutos","Cisternas de barro","Barcos"], correct:1,
      explanation:"Os romanos eram grandes engenheiros e construíram aquedutos para levar água limpa por toda a cidade!" },
    { q:"Por que o Panteão não enche de água quando chove, mesmo com um buraco no teto?", bncc:"EF06HI13", img:null,
      options:["Porque tem um teto invisível","Porque o chão tem inclinação especial que escoa a água","Porque nunca chove em Roma","Porque o buraco se fecha sozinho"], correct:1,
      explanation:"O chão do Panteão foi construído com uma inclinação especial para a água da chuva escorrer!" },
    { q:"O que motiva os turistas a jogar moedas na Fontana di Trevi?", bncc:"EF06HI12",
      img:"https://images.unsplash.com/photo-1520175480921-4edfa2983e0f?w=600&h=300&fit=crop",
      options:["Pagar entrada para ver a fonte","A tradição de fazer um desejo e voltar a Roma","Ajudar a limpar a fonte","Comprar sorte para o time de futebol"], correct:1,
      explanation:"A tradição diz que jogar uma moeda por cima do ombro faz o desejo se realizar e garante uma volta a Roma!" }
  ],
  dificil: [
    { q:"Qual material os romanos inventaram que explica a durabilidade de suas construções até hoje?", bncc:"EF06HI11", img:null,
      options:["Tijolo cozido","Concreto","Vidro temperado","Aço"], correct:1,
      explanation:"Os romanos inventaram o concreto, por isso muitas construções ainda existem depois de 2.000 anos!" },
    { q:"O ditado 'Todos os caminhos levam a Roma' expressa o quê sobre o império?", bncc:"EF06HI14", img:null,
      options:["Que Roma tinha poucas estradas","Que Roma era tão central que todas as estradas pareciam convergir até ela","Que era proibido sair de Roma","Que as estradas eram feitas de ouro"], correct:1,
      explanation:"O ditado mostra como Roma era o centro do mundo antigo: todas as estradas do império pareciam levar até lá!" },
    { q:"Qual é a origem de palavras como 'família' e 'escola', usadas até hoje?", bncc:"EF06HI12", img:null,
      options:["Vêm do grego antigo","Vêm do latim, língua falada pelos romanos","Vêm do egípcio antigo","Foram inventadas na Idade Média"], correct:1,
      explanation:"Muitas palavras que usamos hoje vêm do latim, a língua falada pelos antigos romanos!" },
    { q:"Por que as fontes públicas de Roma são apelidadas de 'nasoni' (narigões)?", bncc:"EF06HI13", img:null,
      options:["Porque o formato lembra um nariz grande","Porque foram feitas por um escultor chamado Naso","Porque ficam perto do nariz das estátuas","Porque cheiram muito bem"], correct:0,
      explanation:"Os 'nasoni' recebem esse apelido porque o bico da fonte lembra o formato de um nariz grande!" },
    { q:"O que a descoberta constante de tesouros arqueológicos durante obras do metrô revela sobre Roma?", bncc:"EF06HI11", img:null,
      options:["Que a cidade moderna foi construída sobre camadas de história antiga","Que os romanos escondiam tesouros de propósito","Que o metrô é mais antigo que a cidade","Que não existem mais ruínas em Roma"], correct:0,
      explanation:"Roma moderna foi construída sobre camadas de história antiga — por isso sempre aparecem tesouros durante escavações!" }
  ]
};

let level = null, pool = [], current = 0, score = 0, selected = null, answered = false, history = [];
const app = document.getElementById('app');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function launchConfetti() {
  const colors = ['#d32f2f','#ff7043','#2e7d32','#f9a825','#1976d2','#8e24aa'];
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDelay = Math.random() * 0.8 + 's';
    el.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

function renderLevelSelect() {
  app.innerHTML = `
    <h1>Quiz sobre Roma! 🏛️</h1>
    <p class="intro-text">Escolha o nível de dificuldade para começar:</p>
    <button class="level-btn level-facil card-fade" data-level="facil">🟢 Fácil</button>
    <button class="level-btn level-medio card-fade" data-level="medio" style="animation-delay:.08s">🟡 Médio</button>
    <button class="level-btn level-dificil card-fade" data-level="dificil" style="animation-delay:.16s">🔴 Difícil</button>
  `;
  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      level = btn.dataset.level;
      pool = shuffle(bank[level]).slice(0, 5);
      current = 0; score = 0; selected = null; answered = false; history = [];
      render();
    });
  });
}

function render() {
  if (current >= pool.length) { renderResult(); return; }
  const q = pool[current];
  const pct = (current / pool.length) * 100;
  app.innerHTML = `
    <h1>Quiz sobre Roma! 🏛️</h1>
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="meta"><span>Pergunta ${current+1} de ${pool.length} (${level})</span><span class="score">Pontuação: ${score}/${pool.length}</span></div>
    ${q.img ? `<img class="question-img" src="${q.img}" alt="Imagem ilustrativa da pergunta ${current+1}">` : ''}
    <div class="question-text">${q.q}</div>
    <div id="options">${q.options.map((opt,i)=>`<button class="option" data-index="${i}" ${answered?'disabled':''}><span class="letter">${String.fromCharCode(65+i)})</span>${opt}</button>`).join('')}</div>
    ${answered ? `<div class="feedback ${selected===q.correct?'correct-fb':'wrong-fb'}">${selected===q.correct?'✅ ':'❌ '}${q.explanation}</div>` : ''}
    <button class="btn" id="nextBtn" ${selected===null?'disabled':''}>${answered?(current===pool.length-1?'Ver Resultado Final':'Próxima Pergunta'):'Confirmar Resposta'}</button>
  `;
  document.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => { if (answered) return; selected = parseInt(btn.dataset.index); render(); });
  });
  if (selected !== null) {
    document.querySelectorAll('.option').forEach((btn,i) => {
      if (!answered && i === selected) btn.classList.add('selected');
      if (answered) {
        if (i === q.correct) { btn.classList.add('correct'); btn.innerHTML += '<span class="mark">✅</span>'; }
        else if (i === selected) { btn.classList.add('wrong'); btn.innerHTML += '<span class="mark">❌</span>'; }
      }
    });
  }
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (!answered) {
      answered = true;
      if (selected === q.correct) score++;
      history.push({ q:q.q, options:q.options, correct:q.correct, explanation:q.explanation, bncc:q.bncc });
      render();
    } else {
      current++; selected = null; answered = false; render();
    }
  });
}

function getMessage() {
  const pct = score / pool.length;
  if (pct === 1) return "🏆 Incrível! Você é um expert em Roma!";
  if (pct >= 0.8) return "🌟 Muito bem! Você conhece bastante sobre Roma!";
  if (pct >= 0.6) return "👍 Bom trabalho! Você está aprendendo sobre Roma!";
  if (pct >= 0.4) return "📚 Continue estudando! Roma tem muito a ensinar!";
  return "🎯 Que tal ler o texto novamente e tentar de novo?";
}

function renderResult() {
  app.innerHTML = `
    <div class="result-screen card-slide">
      <div class="trophy">🏆</div>
      <h1>Quiz Concluído! 🎉</h1>
      <div class="final-score">Sua pontuação: ${score}/${pool.length} (Nível ${level})</div>
      <p>${getMessage()}</p>
      <div class="gabarito"><strong>📋 Gabarito Completo:</strong>
        ${history.map((h,i) => `
          <div class="gabarito-item">
            <div class="bncc-tag">${h.bncc}</div>
            <div class="gabarito-q">${i+1}. ${h.q}</div>
            <div class="gabarito-a">✅ Resposta correta: ${h.options[h.correct]}</div>
            <div class="gabarito-e">${h.explanation}</div>
          </div>
        `).join('')}
      </div>
      <button class="btn" id="restartBtn">🔄 Jogar Novamente (mesmo nível)</button>
      <button class="btn btn-outline" id="changeLevelBtn">🔀 Escolher Outro Nível</button>
    </div>
  `;
  if (score === pool.length || score / pool.length >= 0.8) launchConfetti();
  document.getElementById('restartBtn').addEventListener('click', () => {
    pool = shuffle(bank[level]).slice(0, 5);
    current = 0; score = 0; selected = null; answered = false; history = [];
    render();
  });
  document.getElementById('changeLevelBtn').addEventListener('click', renderLevelSelect);
}

renderLevelSelect();
</script>
<script src="ia_api.js"></script>
<script>IAApi.injectWidget({ context: 'Quiz sobre a Roma Antiga. Explique República, Império, cidadania e sociedade romana.' });</script>
</body>
</html>
