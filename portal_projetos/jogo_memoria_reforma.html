<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Memória — Reforma Protestante</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#eaf1fb;color:#1a202c;min-height:100vh;padding:1rem}
.container{max-width:780px;margin:0 auto}

/* ─── Header ─── */
h1{color:#1a237e;text-align:center;font-size:1.4rem;margin-bottom:.25rem;letter-spacing:-.5px}
.subtitle{text-align:center;color:#5c6bc0;font-size:.8rem;margin-bottom:1rem}

/* ─── Header Bar ─── */
.header-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;flex-wrap:wrap;gap:.5rem}

/* ─── Stats ─── */
.stats{display:flex;gap:.5rem;flex-wrap:wrap}
.stat{background:#fff;border-radius:8px;padding:.5rem 1rem;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center;min-width:80px}
.stat .num{font-size:1.2rem;font-weight:700;color:#1a237e}
.stat .label{font-size:.65rem;color:#78909c;text-transform:uppercase;letter-spacing:.5px}

/* ─── Sound Toggle ─── */
.sound-toggle{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:.5rem .65rem;cursor:pointer;font-size:.85rem;transition:all .2s;display:flex;align-items:center;gap:4px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sound-toggle:hover{background:#f5f5f5;border-color:#caa14b}
.sound-toggle.muted{opacity:.5;background:#f0f0f0}

/* ─── Legend ─── */
.legend{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:1rem}
.legend-item{display:flex;align-items:center;gap:.35rem;font-size:.72rem;padding:.25rem .6rem;border-radius:6px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ─── Status ─── */
.status{text-align:center;margin-bottom:.75rem;font-size:.85rem;color:#546e7a;min-height:1.4em;transition:color .3s}
.status.win{color:#2e7d32;font-weight:700;font-size:.95rem}

/* ─── Board ─── */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:780px;margin:0 auto}
@media(min-width:600px){.board{grid-template-columns:repeat(6,1fr)}}

/* ─── Card ─── */
.card{aspect-ratio:1;perspective:600px;cursor:pointer;outline:none}
.card:focus-visible .card-inner{box-shadow:0 0 0 3px #1a237e}
.card-inner{position:relative;width:100%;height:100%;transition:transform .35s ease;transform-style:preserve-3d;border-radius:8px}
.card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;overflow:hidden}

/* ─── Front (back of card) ─── */
.card-front{background:#5c1a1a;border:2px solid #caa14b;z-index:2}
.card-front svg{width:32px;height:32px;opacity:.9}
@media(min-width:600px){.card-front svg{width:38px;height:38px}}

/* ─── Back (face of card) ─── */
.card-back{transform:rotateY(180deg);padding:6px;font-size:.62rem;line-height:1.2;text-align:center}
.card-back .term{font-weight:700;font-size:.7rem;margin-bottom:2px}
.card-back .def{font-size:.58rem;opacity:.85}
@media(min-width:600px){
  .card-back{padding:10px;font-size:.75rem}
  .card-back .term{font-size:.85rem;margin-bottom:3px}
  .card-back .def{font-size:.68rem}
}

/* ─── Category colors ─── */
.cat-personagens .card-back{background:#eeedfe;color:#26215c;border:2px solid #d5d3fa}
.cat-conceitos .card-back{background:#e1f5ee;color:#04342c;border:2px solid #b8e0d0}
.cat-acontecimentos .card-back{background:#faece7;color:#4a1b0c;border:2px solid #f0d5ca}

/* ─── Matched ─── */
.card.matched{pointer-events:none}
.card.matched .card-inner{opacity:.6;box-shadow:0 0 0 2px #4caf50}

/* ─── Match animation ─── */
@keyframes matchPop{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.08)}100%{transform:rotateY(180deg) scale(1)}}
.card.matched .card-inner{animation:matchPop .35s ease}

/* ─── Restart ─── */
.restart-wrap{text-align:center;margin-top:1rem}
.btn-restart{background:#1a237e;color:#fff;border:none;padding:.55rem 1.5rem;border-radius:8px;font-size:.85rem;font-weight:500;cursor:pointer;transition:background .2s,transform .15s}
.btn-restart:hover{background:#283593;transform:translateY(-1px)}
.btn-restart:active{transform:translateY(0)}

/* ─── Win overlay ─── */
.win-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(3px);z-index:100;align-items:center;justify-content:center}
.win-overlay.show{display:flex}
.win-box{background:#fff;border-radius:12px;padding:2rem;text-align:center;max-width:360px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,.2);animation:winPop .4s ease}
@keyframes winPop{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}
.win-box h2{color:#2e7d32;font-size:1.3rem;margin-bottom:.5rem}
.win-box p{font-size:.85rem;color:#546e7a;margin-bottom:.25rem}
.win-box .highlight{font-weight:700;color:#1a237e}
.win-box .btn-restart{margin-top:1rem}

/* ─── Footer ─── */
footer{text-align:center;margin-top:1.5rem;padding-bottom:.5rem;font-size:.7rem;color:#b0bec5}
</style>
</head>
<body>
<div class="container">
  <h1>🕊️ Reforma &amp; Contrarreforma</h1>
  <p class="subtitle">Jogo da Memória — 7º ano</p>

  <div class="header-bar">
    <div class="stats">
      <div class="stat"><div class="num" id="moves">0</div><div class="label">Jogadas</div></div>
      <div class="stat"><div class="num" id="pairs"><span id="found">0</span>/12</div><div class="label">Pares</div></div>
      <div class="stat"><div class="num" id="timer">00:00</div><div class="label">Tempo</div></div>
    </div>
    <button class="sound-toggle" id="soundToggle" title="Ativar/desativar som" aria-label="Ativar ou desativar sons">
      <span id="soundIcon">🔊</span>
    </button>
  </div>

  <div class="legend">
    <span class="legend-item"><span class="legend-dot" style="background:#d5d3fa"></span>Personagens</span>
    <span class="legend-item"><span class="legend-dot" style="background:#b8e0d0"></span>Conceitos</span>
    <span class="legend-item"><span class="legend-dot" style="background:#f0d5ca"></span>Acontecimentos</span>
  </div>

  <div class="status" id="status">Clique em duas cartas para encontrar os pares</div>

  <div class="board" id="board" role="grid" aria-label="Tabuleiro do jogo da memória"></div>

  <div class="restart-wrap">
    <button class="btn-restart" id="restartBtn">🔄 Reiniciar Jogo</button>
  </div>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-box">
    <h2>🎉 Parabéns!</h2>
    <p>Você encontrou todos os <strong class="highlight">12 pares</strong>!</p>
    <p id="winStats">Total de jogadas: <strong class="highlight">0</strong></p>
    <p id="winTime">Tempo: <strong class="highlight">00:00</strong></p>
    <button class="btn-restart" id="winRestartBtn">🔄 Jogar Novamente</button>
  </div>
</div>

<footer>Profº Flávio Alexandre</footer>

<script>
// ─── Sound Engine (Web Audio API — sem arquivos externos) ──
const SoundFX = (() => {
  let ctx = null;
  let enabled = true;

  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function playTone(freq, duration, type = "sine", volume = 0.15) {
    if (!enabled) return;
    try {
      const c = getCtx();
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, c.currentTime);
      gain.gain.setValueAtTime(volume, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(c.currentTime);
      osc.stop(c.currentTime + duration);
    } catch(e) { /* silent fail */ }
  }

  function playNoise(duration, volume = 0.08) {
    if (!enabled) return;
    try {
      const c = getCtx();
      const bufferSize = c.sampleRate * duration;
      const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.max(0, 1 - i / bufferSize);
      }
      const source = c.createBufferSource();
      source.buffer = buffer;
      const gain = c.createGain();
      gain.gain.setValueAtTime(volume, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
      source.connect(gain);
      gain.connect(c.destination);
      source.start(c.currentTime);
    } catch(e) { /* silent fail */ }
  }

  return {
    get enabled() { return enabled; },
    set enabled(v) { enabled = v; },

    /** Click/Flip curto */
    flip() { playTone(800, 0.08, "sine", 0.12); },

    /** Par encontrado — acorde ascendente */
    match() {
      playTone(523, 0.2, "sine", 0.15);   // C5
      setTimeout(() => playTone(659, 0.2, "sine", 0.15), 100);  // E5
      setTimeout(() => playTone(784, 0.3, "sine", 0.18), 200);  // G5
    },

    /** Sem par — som descendente curto */
    noMatch() {
      playTone(300, 0.15, "triangle", 0.1);
      setTimeout(() => playTone(200, 0.2, "triangle", 0.08), 100);
    },

    /** Vitória — fanfarra completa */
    win() {
      const notes = [523, 659, 784, 1047]; // C5 E5 G5 C6
      notes.forEach((f, i) => {
        setTimeout(() => playTone(f, 0.4, "sine", 0.18), i * 150);
      });
      setTimeout(() => playNoise(0.5, 0.06), 600);
    },

    /** Reiniciar */
    restart() {
      playTone(440, 0.1, "sine", 0.08);
      setTimeout(() => playTone(660, 0.1, "sine", 0.08), 80);
    }
  };
})();

// ─── Sound Toggle UI ──────────────────────────────────────
const soundToggle = document.getElementById("soundToggle");
const soundIcon = document.getElementById("soundIcon");

soundToggle.addEventListener("click", () => {
  SoundFX.enabled = !SoundFX.enabled;
  soundToggle.classList.toggle("muted");
  soundIcon.textContent = SoundFX.enabled ? "🔊" : "🔇";
  if (SoundFX.enabled) SoundFX.flip();
});

// ─── Data ─────────────────────────────────────────────────
const CARDS_DATA = [
  // Personagens (cat 0)
  { pairId:0, term:"Martinho Lutero",   def:"95 Teses (1517)",                    cat:0 },
  { pairId:1, term:"João Calvino",      def:"Calvinismo e predestinação",         cat:0 },
  { pairId:2, term:"Henrique VIII",     def:"Criou a Igreja Anglicana",            cat:0 },
  { pairId:3, term:"Inácio de Loyola",  def:"Fundou os jesuítas",                  cat:0 },
  // Conceitos (cat 1)
  { pairId:4, term:"Indulgências",      def:"Perdão de pecados vendido",           cat:1 },
  { pairId:5, term:"Sola Fide",         def:"Salvação só pela fé",                 cat:1 },
  { pairId:6, term:"Index",             def:"Lista de livros proibidos",           cat:1 },
  { pairId:7, term:"Cisma",             def:"Divisão da Igreja Cristã",            cat:1 },
  // Acontecimentos (cat 2)
  { pairId:8, term:"95 Teses",          def:"Críticas às indulgências",            cat:2 },
  { pairId:9, term:"Concílio de Trento",def:"Resposta católica (1545-1563)",       cat:2 },
  { pairId:10,term:"Inquisição",         def:"Tribunal contra hereges",             cat:2 },
  { pairId:11,term:"Contrarreforma",     def:"Reação católica à Reforma",           cat:2 },
];

const CAT_NAMES = ["personagens","conceitos","acontecimentos"];

// ─── State ─────────────────────────────────────────────────
let cards = [];
let flipped = [];
let matched = new Set();
let moves = 0;
let timerInterval = null;
let seconds = 0;
let gameStarted = false;
let lockBoard = false;

// ─── DOM refs ──────────────────────────────────────────────
const boardEl = document.getElementById("board");
const movesEl = document.getElementById("moves");
const foundEl = document.getElementById("found");
const timerEl = document.getElementById("timer");
const statusEl = document.getElementById("status");
const winOverlay = document.getElementById("winOverlay");
const winStats = document.getElementById("winStats");
const winTime = document.getElementById("winTime");

// ─── Helpers ──────────────────────────────────────────────
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function formatTime(s){
  const m=String(Math.floor(s/60)).padStart(2,"0");
  const sec=String(s%60).padStart(2,"0");
  return `${m}:${sec}`;
}

function catClass(i){ return "cat-"+CAT_NAMES[cards[i].cat]; }

// ─── Timer ─────────────────────────────────────────────────
function startTimer(){
  if(gameStarted) return;
  gameStarted=true;
  timerInterval=setInterval(()=>{
    seconds++;
    timerEl.textContent=formatTime(seconds);
  },1000);
}
function stopTimer(){
  clearInterval(timerInterval);
  timerInterval=null;
}

// ─── Render ────────────────────────────────────────────────
function buildBoard(){
  const deck=[];
  CARDS_DATA.forEach(c=>{
    deck.push({...c,index:deck.length});
    deck.push({...c,index:deck.length});
  });
  cards=shuffle(deck);
  flipped=[];
  matched=new Set();
  moves=0;
  seconds=0;
  gameStarted=false;
  lockBoard=false;
  stopTimer();
  timerEl.textContent="00:00";
  movesEl.textContent="0";
  foundEl.textContent="0";
  statusEl.textContent="Clique em duas cartas para encontrar os pares";
  statusEl.classList.remove("win");
  winOverlay.classList.remove("show");
  renderBoard();
}

function renderBoard(){
  boardEl.innerHTML="";
  cards.forEach((c,i)=>{
    const art=document.createElement("article");
    art.className="card";
    art.setAttribute("role","gridcell");
    art.setAttribute("tabindex","0");
    art.dataset.index=i;

    const crossSvg=`<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#e8c877" stroke-width="1.5"/>
      <rect x="17" y="8" width="6" height="24" rx="1" fill="#e8c877"/>
      <rect x="10" y="17" width="20" height="6" rx="1" fill="#e8c877"/>
    </svg>`;

    art.innerHTML=`
      <div class="card-inner">
        <div class="card-face card-front">${crossSvg}</div>
        <div class="card-face card-back">
          <div class="term">${c.term}</div>
          <div class="def">${c.def}</div>
        </div>
      </div>`;

    art.addEventListener("click",()=>handleCardClick(i,art));
    art.addEventListener("keydown",(e)=>{
      if(e.key==="Enter"||e.key===" "){e.preventDefault();handleCardClick(i,art)}
    });

    boardEl.appendChild(art);
  });
  updateAriaLabels();
}

function updateAriaLabels(){
  document.querySelectorAll(".card").forEach((el,i)=>{
    const c=cards[i];
    const isFlipped=el.classList.contains("flipped")||el.classList.contains("matched");
    if(isFlipped){
      el.setAttribute("aria-label",`${c.term}: ${c.def} – encontrado`);
    } else {
      el.setAttribute("aria-label","Carta virada para baixo");
    }
  });
}

// ─── Game Logic ────────────────────────────────────────────
function handleCardClick(index,el){
  if(lockBoard) return;
  if(el.classList.contains("flipped")||el.classList.contains("matched")) return;

  if(!gameStarted) startTimer();

  // Som ao virar carta
  SoundFX.flip();

  el.classList.add("flipped");
  flipped.push(index);
  updateAriaLabels();

  if(flipped.length===2){
    moves++;
    movesEl.textContent=moves;
    lockBoard=true;
    checkMatch();
  }
}

function checkMatch(){
  const [a,b]=flipped;
  const cardA=cards[a];
  const cardB=cards[b];
  const els=document.querySelectorAll(".card");

  if(cardA.pairId===cardB.pairId){
    // Match!
    SoundFX.match();
    matched.add(cardA.pairId);
    foundEl.textContent=matched.size;
    els[a].classList.add("matched");
    els[b].classList.add("matched");
    flipped=[];
    lockBoard=false;
    updateAriaLabels();
    statusEl.textContent=`✅ Par encontrado! (${matched.size}/12)`;

    if(matched.size===12){
      stopTimer();
      SoundFX.win();
      statusEl.textContent="🎉 Parabéns! Você venceu!";
      statusEl.classList.add("win");
      setTimeout(showWinScreen,600);
    }
  } else {
    // No match
    SoundFX.noMatch();
    statusEl.textContent="❌ Não é um par... Tente novamente!";
    setTimeout(()=>{
      els[a].classList.remove("flipped");
      els[b].classList.remove("flipped");
      flipped=[];
      lockBoard=false;
      updateAriaLabels();
      statusEl.textContent="Clique em duas cartas para encontrar os pares";
    },800);
  }
}

function showWinScreen(){
  winStats.innerHTML=`Total de jogadas: <strong class="highlight">${moves}</strong>`;
  winTime.innerHTML=`Tempo: <strong class="highlight">${formatTime(seconds)}</strong>`;
  winOverlay.classList.add("show");
}

// ─── Init ──────────────────────────────────────────────────
document.getElementById("restartBtn").addEventListener("click",()=>{SoundFX.restart();buildBoard()});
document.getElementById("winRestartBtn").addEventListener("click",()=>{SoundFX.restart();buildBoard()});
buildBoard();
</script>
</body>
</html>
