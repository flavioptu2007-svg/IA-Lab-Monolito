name: Projects CI

# CI para os projetos de usuário em Projetos/ (o repo da home rastreia estes
# arquivos; clones independentes como explainshell e ComfyUI têm CI própria).

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - "Projetos/web/**"
      - "Projetos/leituraia/**"
      - "scripts/test_all.sh"
      - ".github/workflows/projects-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "web/**"
      - "Projetos/web/**"
      - "Projetos/leituraia/**"
      - "scripts/test_all.sh"
      - ".github/workflows/projects-ci.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── web/dashboard: tsc + build ──────────────────────────────────
  web-dashboard:
    name: web/dashboard (tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: tsc e build (scripts/test_all.sh)
        working-directory: ${{ github.workspace }}
        run: ./scripts/test_all.sh --only dashboard-raiz --verbose

  # ─── leituraia: pytest ───────────────────────────────────────────
  leituraia:
    name: leituraia (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: pip install pytest -r Projetos/leituraia/requirements.txt

      - name: Run tests (scripts/test_all.sh)
        run: ./scripts/test_all.sh --only leituraia --verbose

  # ─── leituraia + PostgreSQL: migrações Alembic e API ─────────────
  leituraia-postgres:
    name: leituraia (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leituraia
          POSTGRES_PASSWORD: leituraia
          POSTGRES_DB: leituraia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install pytest -r Projetos/leituraia/requirements.txt

      - name: Run tests (migrações + API no PostgreSQL)
        env:
          LEITURAIA_TEST_DATABASE_URL: postgresql+psycopg://leituraia:leituraia@localhost:5432/leituraia
        run: ./scripts/test_all.sh --only leituraia --verbose

  # ─── web/api: pytest (monolito stubado) ──────────────────────────
  web-api:
    name: web/api (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        # O app monta o LeituraIA quando o pacote é importável; sem as
        # dependências dele as rotas somem e os testes de integração quebram.
        run: pip install pytest prometheus-client -r Projetos/leituraia/requirements.txt

      - name: Run tests (scripts/test_all.sh)
        run: ./scripts/test_all.sh --only web-api --verbose
