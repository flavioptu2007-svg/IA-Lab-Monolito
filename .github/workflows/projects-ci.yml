name: Projects CI

# CI para os projetos de usuário em Projetos/ (o repo da home rastreia estes
# arquivos; clones independentes como explainshell e ComfyUI têm CI própria).

on:
  push:
    branches: [main, master]
    paths:
      - "Projetos/next-app/**"
      - "Projetos/web/**"
      - "Projetos/leituraia/**"
      - "scripts/test_all.sh"
      - ".github/workflows/projects-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "Projetos/next-app/**"
      - "Projetos/web/**"
      - "Projetos/leituraia/**"
      - "scripts/test_all.sh"
      - ".github/workflows/projects-ci.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── next-app: typecheck + lint + build ──────────────────────────
  # Os jobs baixam as dependências e delegam a execução ao
  # scripts/test_all.sh, que é a fonte única da matriz (mesmas verificações que
  # rodam localmente). --verbose devolve ao log a saída completa de cada passo.
  next-app:
    name: next-app (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projetos/next-app
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Projetos/next-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck, lint e build (scripts/test_all.sh)
        working-directory: ${{ github.workspace }}
        run: ./scripts/test_all.sh --only next-app --verbose

  # ─── web/dashboard: lint + build ─────────────────────────────────
  web-dashboard:
    name: web/dashboard (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projetos/web/dashboard
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Projetos/web/dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint e build (scripts/test_all.sh)
        working-directory: ${{ github.workspace }}
        run: ./scripts/test_all.sh --only dashboard-projetos --verbose

  # ─── leituraia: pytest ───────────────────────────────────────────
  leituraia:
    name: leituraia (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: pip install pytest fastapi httpx "pydantic[email]" "python-jose[cryptography]"

      - name: Run tests (scripts/test_all.sh)
        run: ./scripts/test_all.sh --only leituraia --verbose

  # ─── web/api: pytest (monolito stubado) ──────────────────────────
  web-api:
    name: web/api (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: pip install pytest fastapi httpx prometheus-client

      - name: Run tests (scripts/test_all.sh)
        run: ./scripts/test_all.sh --only web-api --verbose
