name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint: Python (ruff) ─────────────────────────────────────
  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,education]"

      - name: Lint with ruff (config do pyproject.toml)
        run: |
          ruff check . --output-format github

      - name: Check formatting com ruff format
        run: |
          ruff format --check --diff .

  # ─── Test: Python (pytest) ────────────────────────────────────
  test-python:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v5

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,education]"

      - name: Run tests with pytest
        run: |
          python3 -m pytest tests/ -v --tb=short --no-header -x \
            --cov=ai --cov=api --cov=src \
            --cov-report=term-missing \
            --cov-report=html:coverage_html
        env:
          IA_LAB_RAG_ENABLED: "false"
          IA_LAB_LOG_LEVEL: "WARNING"

      - name: Upload coverage report
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage_html/
          retention-days: 7

  # ─── Typecheck: Python (mypy) ────────────────────────────────
  typecheck-python:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,education]"

      - name: Typecheck with mypy
        run: |
          python3 -m mypy src api --ignore-missing-imports

  # ─── Build: Dashboard (Vite) ─────────────────────────────────
  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd web/dashboard
          npm ci

      - name: TypeScript check
        run: |
          cd web/dashboard
          npx tsc -b --noEmit

      - name: Build (Vite)
        run: |
          cd web/dashboard
          npm run build

      - name: Upload dashboard build
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-dist
          path: web/dashboard/dist/
          retention-days: 7

  # ─── Test: Shell scripts (shellcheck + bats) ──────────────────
  test-shell:
    name: Test (Shell)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats

      - name: Shellcheck (todos os scripts shell)
        run: |
          shellcheck -S warning scripts/*.sh

      - name: Bats (testes unitários do fluxo do Office 2016 MSI)
        run: |
          bats tests/shell/

  # ─── Summary ─────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint-python, test-python, typecheck-python, build-dashboard, test-shell]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "## ✅ CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| lint-python (3.11) | ${{ needs.lint-python.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| lint-python (3.12) | ${{ needs.lint-python.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| test-python (3.11) | ${{ needs.test-python.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| test-python (3.12) | ${{ needs.test-python.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| typecheck-python   | ${{ needs.typecheck-python.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build-dashboard    | ${{ needs.build-dashboard.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| test-shell         | ${{ needs.test-shell.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
