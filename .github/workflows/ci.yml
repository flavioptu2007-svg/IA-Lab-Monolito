name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint: Python (ruff) ─────────────────────────────────────
  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check ai/ api/ src/ tests/ web/dashboard/src/ \
            --select E,F,W,N,UP,B,SIM,ARG \
            --ignore E501 \
            --output-format github

      - name: Check formatting with black
        run: |
          black --check --diff ai/ api/ src/ tests/ web/

  # ─── Test: Python (pytest) ────────────────────────────────────
  test-python:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with pytest
        run: |
          python3 -m pytest tests/ -v --tb=short --no-header -x \
            --cov=ai --cov=api --cov=src \
            --cov-report=term-missing \
            --cov-report=html:coverage_html
        env:
          IA_LAB_RAG_ENABLED: "false"
          IA_LAB_LOG_LEVEL: "WARNING"

      - name: Upload coverage report
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_html/
          retention-days: 7

  # ─── Build: Dashboard (Vite) ─────────────────────────────────
  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd web/dashboard
          npm ci

      - name: TypeScript check
        run: |
          cd web/dashboard
          npx tsc -b --noEmit

      - name: Build (Vite)
        run: |
          cd web/dashboard
          npm run build

      - name: Upload dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: web/dashboard/dist/
          retention-days: 7

  # ─── Summary ─────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint-python, test-python, build-dashboard]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "## ✅ CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| lint-python (3.11) | ${{ needs.lint-python.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| lint-python (3.12) | ${{ needs.lint-python.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| test-python (3.11) | ${{ needs.test-python.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| test-python (3.12) | ${{ needs.test-python.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build-dashboard    | ${{ needs.build-dashboard.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
