name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint: Python (ruff) ─────────────────────────────────────
  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,education]"

      # Ruff check + ruff format vêm do scripts/test_all.sh, que é a fonte única
      # da matriz: o job só instala as dependências e escolhe as verificações.
      - name: Lint with ruff (scripts/test_all.sh)
        run: ./scripts/test_all.sh --only monolito:ruff-check+ruff-format --verbose

  # ─── Test: Python (pytest) ────────────────────────────────────
  test-python:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v5

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,education]"

      # O script roda `pytest tests/ -q --tb=short` com IA_LAB_RAG_ENABLED=false;
      # PYTEST_ADDOPTS acrescenta o coverage e o -x que o job sempre teve.
      - name: Run tests with pytest (scripts/test_all.sh)
        run: ./scripts/test_all.sh --only monolito:pytest --verbose
        env:
          PYTEST_ADDOPTS: >-
            -x --cov=ai --cov=api --cov=src --cov-report=term-missing
            --cov-report=html:coverage_html --cov-fail-under=70

      - name: Upload coverage report
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage_html/
          retention-days: 3

  # ─── Typecheck: Python (mypy) ────────────────────────────────
  typecheck-python:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,education]"

      - name: Typecheck with mypy (scripts/test_all.sh)
        run: ./scripts/test_all.sh --only monolito:mypy --verbose

  # ─── Build: Dashboard (Vite) ─────────────────────────────────
  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Sem guard silencioso: se o dashboard sumir, o job FALHA em vez de
      # reportar sucesso sem construir nada (verde falso).
      - name: Verificar presença do dashboard
        run: |
          if [ ! -f web/dashboard/package-lock.json ]; then
            echo "::error::web/dashboard/package-lock.json ausente — o dashboard não pode ser construído."
            echo "Restaure o fonte com: git restore --source=3af5f1b^ --worktree -- web"
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd web/dashboard
          npm ci

      - name: TypeScript check e build (scripts/test_all.sh)
        run: ./scripts/test_all.sh --only dashboard-raiz --verbose

      - name: Upload dashboard build
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-dist
          path: web/dashboard/dist/
          retention-days: 3

  # ─── Test: Shell scripts (shellcheck + bats) ──────────────────
  test-shell:
    name: Test (Shell)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats

      # Sem guard silencioso: se os testes de shell sumirem, o job FALHA em vez
      # de reportar sucesso sem rodar nada (mesmo padrão do build-dashboard).
      # O script trata ausência de tests/shell como SKIP, o que sairia verde.
      - name: Verificar presença dos testes de shell
        run: |
          if [ ! -d tests/shell ]; then
            echo "::error::tests/shell/ ausente — não há testes de shell para rodar."
            echo "Adicione testes bats em tests/shell/ (ex.: tests/shell/test_scripts_smoke.bats)."
            exit 1
          fi

      - name: Shellcheck e bats (scripts/test_all.sh)
        run: ./scripts/test_all.sh --only monolito:shellcheck+bats --verbose

  # ─── Summary ─────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint-python, test-python, typecheck-python, build-dashboard, test-shell]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "## ✅ CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| lint-python (3.11) | ${{ needs.lint-python.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| lint-python (3.12) | ${{ needs.lint-python.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| test-python (3.11) | ${{ needs.test-python.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| test-python (3.12) | ${{ needs.test-python.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| typecheck-python   | ${{ needs.typecheck-python.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build-dashboard    | ${{ needs.build-dashboard.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| test-shell         | ${{ needs.test-shell.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
