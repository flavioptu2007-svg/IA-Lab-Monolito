[build-system]
requires = ["setuptools>=69.0", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-lab-unified"
version = "2.0.0"
description = "IA-Lab Unified — Monolito FastAPI com IA, Áudio, RAG, OpenVINO, HistóriaIA e BitNet"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "IA-Lab Team" },
]

keywords = ["ai", "audio", "stt", "tts", "rag", "fastapi", "openvino", "education"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    # ══════════════════════════════════════════════════════════════
    #  Core
    # ══════════════════════════════════════════════════════════════
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "orjson>=3.9.0",

    # ══════════════════════════════════════════════════════════════
    #  AI Providers
    # ══════════════════════════════════════════════════════════════
    "openai>=1.0.0",

    # ══════════════════════════════════════════════════════════════
    #  Monitoring
    # ══════════════════════════════════════════════════════════════
    "prometheus-client>=0.20.0",

    # ══════════════════════════════════════════════════════════════
    #  Audio Processing
    # ══════════════════════════════════════════════════════════════
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "webrtcvad>=2.0.10",
    "soundfile>=0.13.0",

    # ══════════════════════════════════════════════════════════════
    #  Database / RAG
    # ══════════════════════════════════════════════════════════════
    "qdrant-client>=1.12.0",

    # ══════════════════════════════════════════════════════════════
    #  Educação (HistóriaIA) — Core
    # ══════════════════════════════════════════════════════════════
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "redis>=5.0.0",
    "email-validator>=2.1.0",

    # ══════════════════════════════════════════════════════════════
    #  Web / Frontend (mantido para compatibilidade)
    # ══════════════════════════════════════════════════════════════
    "Flask>=3.0.0",
    "opencv-python>=4.9.0",
    "pyzbar>=0.1.9",
]

[project.optional-dependencies]

# ── TTS avançado ────────────────────────────────────────────────
tts = [
    "edge-tts>=6.0.0",
]

# ── STT avançado ────────────────────────────────────────────────
stt = [
    "speechbrain>=1.2.0",
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
]

# ── Desenvolvimento ─────────────────────────────────────────────
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pre-commit>=3.7.0",
]

# ── Intel OpenVINO ──────────────────────────────────────────────
openvino = [
    "openvino>=2026.2.0",
    "optimum-intel>=2.0.0",
    "nncf>=3.2.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.21.0",
    "transformers>=4.51.0",
    "accelerate>=1.5.0",
    "sentencepiece>=0.2.0",
    "datasets>=3.4.0",
    "huggingface-hub>=0.29.0",
    "sentence-transformers>=3.4.0",
    "faiss-cpu>=1.10.0",
]

# ── LangChain / RAG ─────────────────────────────────────────────
langchain = [
    "langchain>=1.3.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
]

# ── Dashboard ───────────────────────────────────────────────────
dashboard = [
    "streamlit>=1.59.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "psutil>=7.0.0",
]

# ── BitNet (LLM 1-bit via llama.cpp) ────────────────────────────
bitnet = [
    "llama-cpp-python>=0.3.0",
]

# ── Educação (HistóriaIA) ────────────────────────────────────────
education = [
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt,argon2]>=1.7.4",
    "argon2-cffi>=23.0.0",
]

# ── Produção ────────────────────────────────────────────────────
prod = [
    "gunicorn>=23.0.0",
    "sentry-sdk>=2.0.0",
]

# ── Tudo (exceto OpenVINO que é pesado) ─────────────────────────
all = [
    "ia-lab-unified[tts,stt,dev,dashboard,bitnet,education,prod]",
]

[project.urls]
Homepage = "https://github.com/flavioptu2007-svg/IA-Lab-Monolito"
Documentation = "https://github.com/flavioptu2007-svg/IA-Lab-Monolito#readme"

[tool.setuptools.packages.find]
include = [
    "ai*",
    "api*",
    "web*",
    "Aplicativo_Coraci*",
    "src*",
]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.json", "*.html", "*.css", "*.js", "*.yaml", "*.yml"]

# ═══════════════════════════════════════════════════════════════════
# Tool Configuration
# ═══════════════════════════════════════════════════════════════════

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
allow_untyped_defs = true
allow_untyped_decorators = true

[[tool.mypy.overrides]]
module = [
    "webrtcvad", "soundfile", "speechbrain", "qdrant_client",
    "asyncpg", "argon2_cffi", "cv2", "pyzbar",
]
ignore_missing_imports = true

[tool.black]
target-version = ["py311"]
line-length = 100
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"
line_length = 100
force_single_line = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
markers = [
    "audio: Tests for audio module",
    "stt: Tests for speech-to-text",
    "tts: Tests for text-to-speech",
    "education: Tests for education module",
    "openvino: Tests for OpenVINO module",
    "integration: Integration tests",
    "slow: Tests that take more than 5 seconds",
]

[tool.coverage.run]
source = ["ai", "api", "web", "src"]
omit = ["*/tests/*", "*/venv/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "def _private",
]

# ═══════════════════════════════════════════════════════════════════
# Install
# ═══════════════════════════════════════════════════════════════════
# Uso básico:
#   pip install -e .                          # Apenas core
#   pip install -e ".[dev]"                   # Core + dev tools
#   pip install -e ".[stt,tts]"              # Core + STT + TTS
#   pip install -e ".[openvino]"             # Core + OpenVINO
#   pip install -e ".[education]"            # Core + Educação
#   pip install -e ".[bitnet]"               # Core + BitNet
#   pip install -e ".[all]"                  # Tudo exceto OpenVINO
