# Alembic — migrações do LeituraIA Brasil
#
# A URL do banco NÃO fica aqui: migrations/env.py lê LEITURAIA_DATABASE_URL
# (ou o SQLite padrão de desenvolvimento). Uso, a partir de ~/Projetos:
#
#   LEITURAIA_DATABASE_URL=postgresql+psycopg:///leituraia \
#     python3 -m alembic -c leituraia/alembic.ini upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
